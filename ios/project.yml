# Game Box — XcodeGen spec. `bash ios/bootstrap.sh` generates GameBox.xcodeproj from this.
# Change bundleIdPrefix / DEVELOPMENT_TEAM to yours (or pick the team in Xcode ▸ Signing).
name: GameBox
options:
  bundleIdPrefix: com.nickburum
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "11.0.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # ← your Team ID (Apple Developer ▸ Membership), or set in Xcode
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"     # iPhone only; use "1,2" to add iPad
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  GameBox:
    type: application
    platform: iOS
    sources:
      - path: GameBox
        excludes: ["web/**"]
      - path: GameBox/web
        type: folder             # blue folder reference: the whole web build ships as-is
        buildPhase: resources
    entitlements:
      path: GameBox/GameBox.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: GameBox/Info.plist
      properties:
        CFBundleDisplayName: Game Box
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.games
        # ─── Google Mobile Ads (rewarded "Continue"). Test app ID below; replace with yours from AdMob.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        NSUserTrackingUsageDescription: Used to show ads that are more relevant to you. The game works the same either way.
