<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- SKIP icon: one stone mid-skip, its hop arc, three ripples, one sun glow. Style guide: docs/review/artist1.md -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2b52"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <radialGradient id="sun" cx="512" cy="420" r="430" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff0c0" stop-opacity=".55"/><stop offset=".45" stop-color="#ff9a5b" stop-opacity=".22"/><stop offset="1" stop-color="#ff9a5b" stop-opacity="0"/></radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab3c0"/><stop offset=".55" stop-color="#7d8794"/><stop offset="1" stop-color="#3f4752"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="420" r="430" fill="url(#sun)"/>
  <!-- hop arc (hero colour) -->
  <path d="M130 760 Q300 420 470 640" fill="none" stroke="#ff9a5b" stroke-width="22" stroke-linecap="round" stroke-dasharray="1 52"/>
  <!-- ripples -->
  <g fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="26">
    <ellipse cx="512" cy="760" rx="300" ry="64"/>
    <ellipse cx="512" cy="760" rx="190" ry="38" stroke-opacity=".9"/>
  </g>
  <ellipse cx="160" cy="790" rx="90" ry="20" fill="none" stroke="#8a7bc8" stroke-width="20"/>
  <!-- the stone: 580 wide, tilted -18deg -->
  <g transform="rotate(-18 512 560)">
    <ellipse cx="512" cy="586" rx="290" ry="118" fill="#2a3140"/>
    <ellipse cx="512" cy="560" rx="290" ry="118" fill="url(#stone)"/>
    <ellipse cx="512" cy="560" rx="279" ry="107" fill="none" stroke="#dfe5ee" stroke-width="22"/>
    <ellipse cx="400" cy="512" rx="96" ry="30" fill="#fff" fill-opacity=".45"/>
  </g>
</svg>
