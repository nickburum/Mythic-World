<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- SKIP icon: one stone mid-skip, its hop arc, three ripples, one sun glow. Style guide: docs/review/artist1.md -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2b52"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <radialGradient id="sun" cx="680" cy="330" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd2a0" stop-opacity=".55"/><stop offset=".5" stop-color="#ff9a5b" stop-opacity=".25"/><stop offset="1" stop-color="#ff9a5b" stop-opacity="0"/></radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d2dc"/><stop offset="1" stop-color="#5a6474"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="680" cy="330" r="420" fill="url(#sun)"/>
  <circle cx="680" cy="330" r="210" fill="#ff9a5b" fill-opacity=".4"/>
  <!-- hop arc (hero colour) -->
  <g fill="#ffb27a"><circle cx="150" cy="720" r="18"/><circle cx="220" cy="600" r="18"/><circle cx="300" cy="540" r="18"/><circle cx="380" cy="560" r="18"/></g>
  <!-- ripples -->
  <g fill="none" stroke="#ffb27a" stroke-width="30">
    <ellipse cx="512" cy="760" rx="300" ry="64" stroke-opacity=".45"/>
    <ellipse cx="512" cy="760" rx="190" ry="38" stroke-opacity=".85"/>
  </g>
  <ellipse cx="160" cy="790" rx="90" ry="20" fill="none" stroke="#8a7bc8" stroke-width="20"/>
  <!-- the stone: 580 wide, tilted -18deg -->
  <g transform="rotate(-18 512 560)">
    <ellipse cx="512" cy="586" rx="290" ry="118" fill="#2a3140"/>
    <ellipse cx="512" cy="560" rx="290" ry="118" fill="url(#stone)"/>
    <ellipse cx="512" cy="560" rx="277" ry="105" fill="none" stroke="#eef3f8" stroke-width="26"/>
    <ellipse cx="400" cy="512" rx="96" ry="30" fill="#fff" fill-opacity=".45"/>
  </g>
</svg>
