<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MELT icon: the droplet hero (with its face), a small ice cube and a steam puff — the three states. Style guide: docs/review/artist1.md -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2b52"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <radialGradient id="glow" cx="512" cy="580" r="400" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3aa7ff" stop-opacity=".35"/><stop offset="1" stop-color="#3aa7ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="drop" cx="430" cy="500" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9ad8ff"/><stop offset=".5" stop-color="#3aa7ff"/><stop offset="1" stop-color="#1a63ad"/></radialGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6fbff"/><stop offset="1" stop-color="#8fd6f0"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="600" r="400" fill="url(#glow)"/>
  <!-- ice cube, top left -->
  <rect x="140" y="150" width="210" height="210" rx="46" fill="url(#ice)" transform="rotate(-10 245 255)"/>
  <rect x="172" y="178" width="70" height="56" rx="18" fill="#fff" fill-opacity=".7" transform="rotate(-10 245 255)"/>
  <!-- steam puff, bottom right -->
  <g fill="#f4f7ff"><circle cx="790" cy="812" r="62"/><circle cx="860" cy="790" r="74"/><circle cx="920" cy="830" r="52"/><rect x="740" y="812" width="220" height="64" rx="32"/></g>
  <!-- droplet hero -->
  <path d="M512 196 C 600 330 780 470 780 640 C 780 800 660 900 512 900 C 364 900 244 800 244 640 C 244 470 424 330 512 196 Z" fill="url(#drop)"/>
  <path d="M512 196 C 600 330 780 470 780 640 C 780 800 660 900 512 900 C 364 900 244 800 244 640 C 244 470 424 330 512 196 Z" fill="none" stroke="#bdf0ff" stroke-width="26" stroke-linejoin="round"/>
  <ellipse cx="400" cy="560" rx="62" ry="34" transform="rotate(-50 400 560)" fill="#fff" fill-opacity=".45"/>
  <!-- face -->
  <circle cx="440" cy="672" r="34" fill="#0f1628"/><circle cx="584" cy="672" r="34" fill="#0f1628"/>
  <circle cx="450" cy="660" r="11" fill="#fff"/><circle cx="594" cy="660" r="11" fill="#fff"/>
  <path d="M460 752 Q512 796 564 752" fill="none" stroke="#0f1628" stroke-width="18" stroke-linecap="round"/>
</svg>
