<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Game Box</title>
  <meta name="description" content="Five tiny games in one box. Pick one and play." />
  <meta name="theme-color" content="#0f1628" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Game Box" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="art/icon.svg" />
  <link rel="apple-touch-icon" href="art/icon-180.png" />
  <link rel="stylesheet" href="css/box.css" />
</head>
<body data-view="home">
  <div class="bg" aria-hidden="true"></div>

  <!-- ─── Home ─── -->
  <main id="home" class="home">
    <header class="top">
      <button id="toggle-sound" class="icon-btn" type="button" aria-label="Sound">
        <svg id="sound-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
        <svg id="sound-off" viewBox="0 0 24 24" hidden><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
      </button>
      <div class="brand"><h1>GAME BOX</h1><small>Five games</small></div>
      <button id="open-settings" class="icon-btn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <section id="hero" class="hero">
      <h2 class="section-title" id="hero-title">Jump back in</h2>
      <button id="hero-btn" class="hero-card" type="button">
        <img id="hero-icon" class="hero-icon" alt="" />
        <div class="hero-text">
          <b id="hero-name">SKIP</b>
          <p id="hero-tagline" class="tagline"></p>
          <span id="hero-best" class="chip">best<b>—</b></span>
        </div>
        <span class="hero-play"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></span>
      </button>
    </section>

    <section class="grid-wrap">
      <h2 class="section-title">All games</h2>
      <div id="grid" class="grid" role="list"></div>
    </section>

    <footer class="foot">One finger · no downloads</footer>
  </main>

  <!-- ─── Player (a game running inside the box) ─── -->
  <section id="player" class="player" hidden>
    <iframe id="frame" class="frame" title="Game" allow="autoplay; vibrate" src="about:blank"></iframe>
    <button id="back" class="back-pill" type="button" aria-label="Back to games"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="back-label">Games</span></button>
    <div id="loading" class="loading"><div class="spinner"></div></div>
  </section>

  <!-- ─── Settings sheet ─── -->
  <section id="settings" class="sheet-wrap" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet">
      <div class="grabber"></div>
      <h2>SETTINGS</h2>
      <label class="toggle"><span>Sound</span><input id="opt-sound" type="checkbox" checked /><i></i></label>
      <label class="toggle"><span>Haptics</span><input id="opt-haptics" type="checkbox" checked /><i></i></label>
      <label class="field"><span>Graphics</span>
        <select id="opt-quality" class="select"><option value="auto">Auto</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
      </label>
      <p class="note">Applies to every game in the box.</p>
      <button id="replay-tutorials" class="btn" type="button">Show tutorials again</button>
      <button id="reset-scores" class="btn danger" type="button">Reset all scores</button>
      <button class="btn primary" type="button" data-close>Done</button>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="src/box.js"></script>
</body>
</html>
