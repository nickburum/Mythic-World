<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- POP icon: one hero bubble with the game's face (the target swatch), two small bubbles, sparks. Style guide: docs/review/artist1.md -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14304a"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <radialGradient id="glow" cx="512" cy="560" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5ef0b0" stop-opacity=".35"/><stop offset="1" stop-color="#5ef0b0" stop-opacity="0"/></radialGradient>
    <radialGradient id="hero" cx="420" cy="440" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b9ffe0"/><stop offset=".55" stop-color="#4fe0a2"/><stop offset="1" stop-color="#1fae74"/></radialGradient>
    <radialGradient id="pink" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffc2dc"/><stop offset="1" stop-color="#e2337f"/></radialGradient>
    <radialGradient id="sky" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#d8fbff"/><stop offset="1" stop-color="#3cc4dc"/></radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="560" r="420" fill="url(#glow)"/>
  <!-- small bubbles -->
  <circle cx="196" cy="300" r="92" fill="url(#pink)"/><circle cx="196" cy="300" r="84" fill="none" stroke="#ffd6e7" stroke-width="12"/>
  <ellipse cx="166" cy="266" rx="24" ry="14" transform="rotate(-40 166 266)" fill="#fff" fill-opacity=".8"/>
  <circle cx="840" cy="236" r="84" fill="url(#sky)"/><circle cx="840" cy="236" r="77" fill="none" stroke="#e2fdff" stroke-width="11"/>
  <ellipse cx="812" cy="205" rx="22" ry="13" transform="rotate(-40 812 205)" fill="#fff" fill-opacity=".8"/>
  <!-- hero bubble -->
  <circle cx="512" cy="580" r="300" fill="url(#hero)"/>
  <circle cx="512" cy="580" r="287" fill="none" stroke="#c8ffe6" stroke-width="26"/>
  <ellipse cx="398" cy="452" rx="74" ry="42" transform="rotate(-40 398 452)" fill="#fff" fill-opacity=".45"/>
  <!-- face -->
  <circle cx="436" cy="560" r="40" fill="#fff"/><circle cx="588" cy="560" r="40" fill="#fff"/>
  <circle cx="446" cy="572" r="22" fill="#0f1628"/><circle cx="598" cy="572" r="22" fill="#0f1628"/>
  <path d="M452 660 Q512 712 572 660" fill="none" stroke="#0f1628" stroke-width="18" stroke-linecap="round"/>
  <!-- sparks -->
  <g stroke="#fff" stroke-width="30" stroke-linecap="round"><path d="M512 150 L512 210"/><path d="M700 330 L744 286"/><path d="M324 330 L280 286"/></g>
</svg>
