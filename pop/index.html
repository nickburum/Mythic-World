<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>POP</title>
  <meta name="description" content="Pop the bubbles that match the colour. Miss three and it's over." />
  <meta name="theme-color" content="#2a1430" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="art/icon.svg" />
  <link rel="apple-touch-icon" href="art/icon-180.png" />
  <link rel="stylesheet" href="../css/game-ui.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-state="title">
  <canvas id="game" aria-label="POP game"></canvas>
  <section id="title" class="overlay menu" data-ui>
    <header class="title-block"><div class="eyebrow">Match the colour</div><h1 class="logo">POP</h1><p class="tagline">Pop the bubbles that match. Let the others float by.</p></header>
    <div class="sheet-ish">
      <button id="play" class="btn primary big" type="button">Play</button>
      <div class="title-best">Best <strong id="best">0</strong></div>
    </div>
  </section>
  <section id="hud" class="overlay no-block" hidden>
    <div class="hud-top"><div id="score" class="score">0</div><div class="sub">POP <span id="target-name">ROSE</span></div><div id="lives" class="lives">●●●</div></div>
  </section>
  <section id="over" class="overlay menu" data-ui hidden>
    <div class="panel over-panel">
      <div id="new-best" class="new-best" hidden>New best</div>
      <div class="label">Popped</div><div id="over-score" class="big">0</div>
      <div class="row"><div class="stat"><div class="label">Best</div><div id="over-best" class="mid">0</div></div></div>
      <div id="over-combo" class="combo"></div>
      <button id="retry" class="btn primary big" type="button">Play again</button>
      <button id="to-title" class="btn ghost" type="button">Menu</button>
    </div>
  </section>
  <button id="mute" class="icon-btn corner-btn" type="button" data-ui aria-label="Mute"><svg class="ico-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg><svg class="ico-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg></button>
  <script type="module" src="src/main.js"></script>
  <script src="../switcher.js" data-game="pop"></script>
</body>
</html>
